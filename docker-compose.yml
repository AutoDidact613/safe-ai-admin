# Local development stack — full topology (mongo + postgres run locally so a new
# developer needs no cloud accounts to get started). Production uses
# docker-compose.prod.yml instead, which points MONGO_URI/DATABASE_URL at the
# managed Atlas / Neon (or equivalent) instances and does not run local db containers.
#
# Usage: cp .env.example .env  (fill in values)  &&  docker compose up --build

services:
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm_pass}
      POSTGRES_DB: ${POSTGRES_DB:-litellm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./infra/litellm/litellm_config.yaml:/app/config.yaml:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-llm_user}:${POSTGRES_PASSWORD:-llm_pass}@postgres:5432/${POSTGRES_DB:-litellm_db}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:4000/health/liveliness"]
      interval: 15s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      litellm:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./apps/server:/app
      - server_node_modules:/app/node_modules
    env_file:
      - ./apps/server/.env
    environment:
      NODE_ENV: development
      PORT: 3001
      LITELLM_PROXY_URL: http://litellm:4000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/filtersdk}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}

  nginx:
    build:
      context: .
      dockerfile: infra/docker/nginx/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo_data:
  postgres_data:
  server_node_modules:
