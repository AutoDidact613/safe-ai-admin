name: Node.js CI (Tender Board Tests)

# 1. מתי ה-CI ירוץ? (טריגרים)
on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

# 2. מה ה-CI יעשה בפועל?
jobs:
  test:
    runs-on: ubuntu-latest # הרצת הבדיקות על שרת לינוקס נקי בענן

    steps:
      # שלב א': שכפול הקוד שלך מהמאגר (Repository) אל תוך שרת ה-CI
      - name: Checkout repository
        uses: actions/checkout@v4

      # שלב ב': התקנת סביבת Node.js בגרסה יציבה ומעודכנת
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # גרסת Node.js מומלצת ויציבה
          cache: 'npm'       # שמירת קבצי ה-node_modules במטמון (Cache) לטעינה מהירה

      # שלב ג': התקנת התלויות (Dependencies) של הפרויקט
      - name: Install dependencies
        run: npm ci # פקודה מומלצת ל-CI (התקנה נקייה ומהירה לפי קובץ ה-lock)

      # שלב ד': בדיקה שה-TypeScript מתקמפל ללא שגיאות קומפילציה
      - name: Check TypeScript Compilation
        run: npm run build --if-present

      # שלב ה': הרצת בדיקות ה-Jest שכתבנו
      - name: Run Jest Unit Tests
        run: npm test