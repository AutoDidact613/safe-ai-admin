name: CD - Production

# Deploys on every push to `main`. Builds & publishes images, then deploys
# via AWS SSM Run Command — no SSH keys and no port 22 open to the internet.
# GitHub authenticates to AWS via OIDC (short-lived credentials only, nothing
# long-lived stored as a secret). See docs/DEPLOYMENT.md for the one-time AWS
# IAM/OIDC setup this depends on.
#
# Recommended: configure the "production" GitHub Environment (Settings ->
# Environments) with required reviewers, so a human approves before this
# job runs — this cannot be set from workflow YAML, only from repo settings.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase: Docker tags reject uppercase, but github.repository
  # resolves to "SafeAI613/SafeAI-613" (mixed case) — using it directly
  # broke the first real run of the staging workflow, so fixing it here too.
  IMAGE_BASE: ghcr.io/safeai613/safeai-613

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: ./apps/server
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/server:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_BASE }}/server:latest

      - name: Build & push agent
        uses: docker/build-push-action@v6
        with:
          context: ./apps/agent
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/agent:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_BASE }}/agent:latest

      - name: Build & push nginx (client)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/nginx/Dockerfile
          build-args: |
            VITE_API_URL=/console/api
            VITE_BASE_PATH=/console/
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/nginx:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_BASE }}/nginx:latest

  deploy:
    name: Deploy to production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # required to mint the short-lived OIDC token for AWS — no long-lived AWS keys are stored anywhere
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy over AWS SSM Run Command
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_REGISTRY: ${{ env.IMAGE_BASE }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.repository }}@${{ github.sha }} (production)" \
            --parameters "{\"commands\":[
              \"set -e\",
              \"cd /opt/safeai-613\",
              \"export IMAGE_REGISTRY=$IMAGE_REGISTRY\",
              \"export IMAGE_TAG=$IMAGE_TAG\",
              \"docker compose -f docker-compose.prod.yml pull\",
              \"docker compose -f docker-compose.prod.yml up -d\",
              \"docker image prune -f\"
            ]}" \
            --query "Command.CommandId" --output text)

          echo "SSM command sent: $COMMAND_ID"

          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "--- stdout ---"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
              echo "--- stderr ---"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
              exit 1
            fi
          done
          echo "Timed out waiting for the deploy command to finish"
          exit 1
